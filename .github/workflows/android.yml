name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testFullDebugUnitTest testPlayDebugUnitTest
      - name: Lint
        run: ./gradlew lintFullDebug lintPlayDebug
      - name: Build APKs
        run: ./gradlew assembleFullDebug assemblePlayDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
