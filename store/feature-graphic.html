<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:linear-gradient(135deg,#0B6E4F 0%,#064330 100%);font-family:"Roboto","Noto Sans",system-ui,sans-serif;color:#fff;position:relative}
.text{position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.mark{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.25);margin-bottom:24px;background:url('graphics/icon-512.png') center/cover}
h1{font-size:56px;line-height:1.05;margin:0 0 16px;font-weight:700;letter-spacing:-0.5px}
p{font-size:26px;line-height:1.35;margin:0;color:rgba(255,255,255,.88)}
.chips{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:18px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.14)}
.phone{position:absolute;right:70px;top:36px;width:300px;height:600px;border-radius:36px;background:#111;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:rotate(-4deg)}
.screen{width:100%;height:100%;border-radius:28px;background:url('graphics/screenshot-3-whatsapp-update.png') top/cover}
</style></head><body>
<div class="text"><div class="mark"></div><h1>Harambee Tracker</h1>
<p>Contributions, pledges and totals — WhatsApp updates in one tap.</p>
<div class="chips"><span class="chip">✅ No double counting</span><span class="chip">📊 Running total</span><span class="chip">🔒 Private</span></div></div>
<div class="phone"><div class="screen"></div></div>
</body></html>
